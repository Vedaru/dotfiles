listener {
    timeout = 280
    on-timeout = ~/.config/waybar/scripts/backlight-ctl.sh save && ~/.config/waybar/scripts/backlight-ctl.sh set 2%
    on-resume = ~/.config/waybar/scripts/backlight-ctl.sh restore
}

listener {
    timeout = 300
    on-timeout = ~/.config/waybar/scripts/backlight-ctl.sh set 0%
    on-resume = ~/.config/waybar/scripts/backlight-ctl.sh restore
}

listener {
    timeout = 310
    on-timeout = hyprlock
}

# Hard panel off shortly after locking (NVIDIA backlight can't reach true black)
listener {
    timeout = 320
    on-timeout = hyprctl dispatch "hl.dsp.dpms('off')"
    on-resume = hyprctl dispatch "hl.dsp.dpms('on')"
}
