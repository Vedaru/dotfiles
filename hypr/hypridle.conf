listener {
    timeout = 280
    on-timeout = brightnessctl -d intel_backlight --save && brightnessctl -d intel_backlight set 2%
    on-resume = brightnessctl -d intel_backlight --restore
}

listener {
    timeout = 300
    on-timeout = brightnessctl -d intel_backlight set 0%
    on-resume = brightnessctl -d intel_backlight --restore
}

listener {
    timeout = 310
    on-timeout = hyprlock
}
